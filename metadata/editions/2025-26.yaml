# NZ Cost-Effective Land Cover, 2025/26 edition — NOT PUBLISHED ON LRIS, see _TODO.
# This edition is supplied directly as a file accompanied by this metadata record;
# it is not on the LRIS Portal and will not be. layer_id and layer_slug therefore
# stay null deliberately (not "to be filled in"): a null layer_slug makes render.py
# and the template omit every LRIS-layer block — the portal identifier, the layer
# link in the citation, the portal transfer option — and name the distributor as
# MWLR directly. publication_date is null for the same reason: the citation carries
# a creation date only.
# Almost everything else lives in ../common.yaml (method facts; this file wins on
# any key it defines) — this file holds only what is unique to the edition.
# Prose in common.yaml re-binds to these scalars through Jinja placeholders.
# Regenerate with: python3 render.py 2025-26.yaml

edition: 2025/26
title: NZ Cost-Effective Land Cover (2025/26)
alternate_title: NZ Land Cover (cost-effective method), 2025/26 summer
