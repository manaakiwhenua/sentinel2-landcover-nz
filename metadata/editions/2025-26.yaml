  metadata_date: '2026-08-20T00:00:00+12:00'
  creation_date: '2026-08-01'
  publication_date: null # not published; deliberate, see header comment
  layer_id: null # no LRIS layer; deliberate, see header comment
  layer_slug: null # no LRIS layer; deliberate, see header comment
  temporal_begin: '2025-11-01'
  temporal_end: '2026-02-28'
  temporal_id: nominal-summer-mosaic-2025-26
  # five-year Sentinel-2 NDVI window used for cropland detection: exactly five
  # years ending with the mapped summer (user-confirmed 2026-08-20)
  ndvi_period: March 2021 to February 2026
  ndvi_years: 2021–2026
  qml_document_id: 26004
  qml_document_version: 28292
  qml_slug: 26004-celcmqml
