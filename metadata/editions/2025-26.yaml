distribution_description: This edition is supplied directly by Manaaki Whenua – Landcare Research as
  a single-band categorical raster with a raster attribute table, in the NZTM projection at {{ scalars.resolution_m
  }} m resolution, accompanied by this metadata record. Unlike earlier editions of the series, it is
  not published on the LRIS Portal and there is no plan to publish it there. References elsewhere in
  this record to the published dataset denote the sieve-filtered product as supplied.
qml_online_description: The QGIS style file itself (QML). The style file is published as a document
  on the LRIS Portal and applies to every edition of the series; this edition's dataset itself is not
  published there.
metadata_maintenance_note: Metadata drafted from Dymond et al. (2026), MWLR contract reports LC2526-0006
  and 2526-0005, and the QGIS style file celcmqml.qml. Fields marked "CHECK" in the XML comments require
  confirmation against the production code or the supplied file.
