# Method- and series-level facts shared by every edition of the NZ
# Cost-Effective Land Cover series — which is nearly everything: the method is
# validated once (on the 2023/24 edition) and re-run on more recent imagery,
# so the classes, lineage, quality reports and abstract are method facts.
# Edition-bound values inside the prose ({{ edition }}, season dates, the NDVI
# window) are Jinja placeholders that re-bind to each edition's scalars at
# render time; references to 2023/24 written literally (validation, model
# training) are historical facts that hold for every edition.
#
# Deep-merged UNDER each editions/*.yaml by render.py: an edition file that
# defines the same key overrides the value here (dicts merge key by key; lists
# and scalars are replaced whole).
#
# WARNING: a change here alters EVERY edition on its next re-render, including
# editions already published. When the method changes for a new edition (say,
# an LCDB v6 burn-in), do NOT edit the affected keys here — copy them into the
# new edition's file and edit them there. Only edit here when the change should
# apply to every edition, or after moving the old wording down into the
# already-published editions' files.

