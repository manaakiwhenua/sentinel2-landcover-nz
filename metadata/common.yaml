    doi: 10.3390/rs12223680
    other_details: Shepherd, J.D., Schindler, J., Dymond, J.R. (2020). Remote Sensing 12, 3680.
- description: 'New Zealand Land Cover Database (LCDB) version 5, nominal date 2018/19, mapped at 1:50,000
    with a 1 ha minimum mapping unit. Used for three distinct purposes: (a) as U-Net training data — a
    class polygon layer of 101,396 exotic forest polygons, derived using a class mapping suggested by
    the Ministry for the Environment, with Broadleaved Indigenous Hardwoods and Deciduous Hardwoods separated
    out for testing and the LCDB "Forest – Harvested" class treated as bare land and excluded from exotic
    forest training; (b) as ancillary evidence within the spectral hierarchy, conditionally relaxing the
    near-infrared, shortwave-infrared and red thresholds wherever LCDB has pre-identified forest, mangrove
    or scrub; and (c) as the direct source of classes burned into the final map — wetlands (LCDB class
    15), orchards and vineyards (LCDB class 16), and the glacial lakes extent. LCDB v6.0 was not available
    when the method was developed and the 2023/24 edition produced; later editions, including those produced
    after v6.0 became available, continue to use version 5.'
  citation:
    title: LCDB v5.0 — Land Cover Database version 5.0, Mainland New Zealand
    originator: Manaaki Whenua – Landcare Research
    url: https://lris.scinfo.org.nz/layer/104400-lcdb-v50-land-cover-database-version-50-mainland-new-zealand/
- description: 'National digital elevation model. Manaaki Whenua''s national DEM, generated at 15 m
    postings from LINZ 1:50,000 topographic data — 20 m contours, spot heights, lake shorelines and
    coastline — using the TOPOGRID function of ArcGIS (ESRI), optimised for slope accuracy for standardised-reflectance
    terrain correction and hydrologically consistent with the NIWA digital stream network. Used in this
    workflow resampled to the 10 m analysis grid: for topographic normalisation of reflectance, to eliminate
    terrain below 150 m elevation from the snow class, and to constrain cropland to sufficiently flat
    terrain. The DEM is not separately published as a dataset; its derivation is described on the Our
    Environment (Land Atlas of New Zealand) data-provenance page, cited here.'
  citation:
    title: Manaaki Whenua national 15 m digital elevation model
    originator: Manaaki Whenua – Landcare Research
    url: https://ourenvironment.scinfo.org.nz/data-provenance#dem
  resolution_m: 15
lineage_steps:
- description: Image acquisition. All available Copernicus Sentinel-2 MSI scenes covering New Zealand
    for the {{ edition }} summer season ({{ scalars.temporal_begin | nzdate }} to {{ scalars.temporal_end
    | nzdate }} inclusive) were assembled; approximately
    100 overpasses contribute to a national summer season.
  rationale: Summer imagery maximises the spectral separability of vegetation classes and the number of
    cloud-free observations.
  processor: true
- description: 'Radiometric standardisation. Each scene was corrected to standardised spectral reflectance:
    atmospherically corrected and normalised to a standard sun position and flat topography, so that reflectance
    becomes a property of the vegetation alone, independent of sun position, slope and view direction.
    Methods follow Dymond and Shepherd (1999), Dymond et al. (2001), Shepherd and Dymond (2003) and Dymond
    and Shepherd (2004). The national digital elevation model (15 m postings, resampled to the 10 m
    analysis grid) is used for the topographic normalisation.'
  rationale: Standardised reflectance is what allows fixed spectral thresholds to be applied consistently
    over a national extent and to remain stable between years.
  reference:
    title: A simple physical model of vegetation reflectance for standardising optical satellite imagery
    doi: 10.1016/S0034-4257(00)00178-4
- description: Cloud and cloud-shadow masking. Masks were generated with an improved multi-temporal mask
    (Tmask) algorithm for cloud detection, refined by the parallax method of Frantz et al. (2018) and
    by an object-based cloud and shadow classification to remove false cloud detections, with the final
    masks checked by an object-based morphology test (Shepherd et al., 2020).
  rationale: New Zealand's frequent cloud cover is the principal obstacle to national optical mapping;
    aggressive but verified masking is required before compositing.
- description: Mosaicking. Cloud-free observations were composited into a single national summer mosaic
    of standardised spectral reflectance at 10 m resolution, following Shepherd et al. (2020). Residual
    cloud in the resulting mosaic is typically below 0.1 %; the small areas that remain in the {{ edition }}
    mosaic were assigned class 0 (Unclassified) in the final output. This mosaic is the object of classification.
  reference:
    title: Automated mosaicking of Sentinel-2 satellite imagery
    doi: 10.3390/rs12223680
- description: 'Hierarchical spectral rule classification. Binary decision rules were applied sequentially
    down a hierarchy: snow first (constrained by the digital elevation model to terrain above 150 m, to
    avoid confusion with bright coastal water such as whitecaps and turbid estuary water); then water,
    from the near-infrared and shortwave-infrared bands alongside the visible bands; then land into bare
    ground and vegetation; then vegetation into herbaceous and woody; then woody into narrow-leaved scrub
    and other woody vegetation, and other woody vegetation into broadleaved shrub and forest/trees. Each
    node applies a simple binary discriminant function on a spectral band or band ratio (ρ1 blue, ρ2 green,
    ρ3 red, ρ4 near-infrared 0.77–0.90 µm, ρ5 shortwave infrared 1.55–1.75 µm); the full rule set is in
    Appendix A of the source paper and Table 4 of Dymond and Shepherd (2004). Thresholds were retained
    from Dymond and Shepherd (2004) except for the narrow-leaved scrub split on (ρ4 − ρ5)/(ρ4 + ρ5), reduced
    from 0.33 to 0.25. LCDB is used as ancillary evidence at this stage, relaxing the near-infrared, shortwave-infrared
    and red thresholds wherever it has pre-identified forest, mangrove or scrub.'
  rationale: Land covers are naturally organised into a hierarchy; a different discrimination function
    can be used at each node; binary discriminant functions are simple to express and to repeat; and covers
    identified by other methods can be injected at a suitable point in the tree. Threshold values were
    selected interactively to achieve optimum spatial distribution according to expert judgement.
- description: 'Training the U-Net deep-learning models. A U-Net encoder–decoder convolutional network
    was trained to generate a class raster over 13 classes for the North Island and 12 for the South Island
    (the initial class set proposed by the Ministry for the Environment, plus a separation of indigenous
    hardwoods from deciduous hardwoods to test whether small patches of deciduous and evergreen trees
    could be discriminated; ''mangrove'' does not occur in the South Island). Training data were a class
    polygon layer derived from LCDB v5. The original U-Net width of 64 filters in the initial layer was
    selected: greater widths added compute cost for negligible gain. Training ran for 1,000 epochs on
    512 × 512 pixel patches, each epoch comprising 300 minibatches of two images, using the Adam optimiser
    with an initial learning rate of 0.0001, with evaluation against a validation set after every epoch
    and selection of the model with the lowest validation loss. The selected models were trained on 50
    % of the imagery, validated on 10 %, and tested on the remaining 40 %.


    Two different normalisation strategies were adopted to maximise robustness across mosaics from different
    periods, assessed by the quality of the 2023/24 prediction and specifically by minimising false positives
    of exotic forestry caused by differences in pixel distributions. North Island: train on the 2016/17,
    2017/18 and 2018/19 mosaics, normalising all image patches identically on the average mean and standard
    deviation of all three. South Island: train on the 2018/19 mosaic alone, normalising each individual
    image patch to zero mean and unit standard deviation. The difference arises because South Island mosaics
    differ more from year to year due to climate, whereas in the North Island image lighting differences
    dominate.'
  rationale: Exotic forest cannot be separated from indigenous forest by spectral signature alone; texture
    and spatial context are decisive, and encoder–decoder networks exploit contextual patterns in surrounding
    pixels to disambiguate them.
- description: Identification of small woody clumps. A centre-to-edge ratio computation was applied to
    identify small clusters of woody vegetation (less than 0.2 ha), which were labelled Unspecified Woody
    Vegetation.
  rationale: Such clumps contain insufficient pixel-level information to be classified further at 10 m
    resolution. A separate attempt to discriminate conifer from non-conifer trees using a model trained
    on regional aerial imagery was judged unsuccessful — owing to a lack of ground truth, highly variable
    image quality, unknown survey dates, and confusion between tree species of different ages — so these
    stands remain unspecified.
- description: Conditional application of the deep-learning classification. The trained models were applied
    to the {{ edition }} mosaic; the resulting exotic forest was accepted only within the forest branch
    of the decision hierarchy, as a disambiguation of forest already identified by the earlier binary
    splits, and deciduous hardwoods were accepted from the same prediction wherever the terrain is lowland
    — a label not additionally confined to the woody branch.
  rationale: Constraining the deep-learning result prevents it from over-ruling prior binary decisions,
    gives a more deterministic output, and stops the final exotic forestry from simply reproducing its
    1:50,000 LCDB training data. In particular, the models learned from LCDB to include areas of bare
    land within forestry, which is a misidentification at 10 m resolution; conditional application corrects
    for this.
- description: Spectral splitting of the remaining woody vegetation. Near-infrared / shortwave-infrared
    threshold rules separated narrow-leaved scrub, and a green-reflectance rule separated broadleaved
    shrub, from the remaining forest/trees.
- description: 'NDVI temporal sequence identification of cropland, the final binary split. All available
    cloud-masked, topographically normalised Sentinel-2 images from {{ scalars.ndvi_period }} inclusive
    were used to compute an NDVI time series following Amies et al. (2021), yielding three metrics per
    pixel: the median NDVI of vegetated pixels, the median NDVI of all observations, and the ratio of
    time in vegetation to time not in vegetation. Visualised as an RGB stretch, areas of cropland are
    distinct — alternation between fallow and vegetated periods across the five-year sequence — giving
    rise to simple threshold rules. Cropland was additionally conditioned on the terrain being sufficiently
    flat to be plausible cropland, per the digital elevation model.'
  rationale: Cropland is not separable in a single-date summer image; it is defined by a multi-year pattern
    of tillage and regrowth. Basing the identification on five years rather than a single date avoids
    treating a process that is not strictly annual at field scale as a point-in-time observation. The
    limitation is that the method detects the bare/vegetated cycle without regard to the time of year
    at which it occurs, so cropping is the probable but not the only possible explanation of the signal.
  reference:
    title: National mapping of New Zealand pasture productivity using temporal Sentinel-2 data
    doi: 10.3390/rs13081481
- description: 'LCDB burn-in. Wetlands (LCDB class 15) and orchards and vineyards (LCDB class 16) were
    accepted as given and burned in from LCDB version 5, as was the glacial lakes extent, producing the
    classified land-cover dataset: a single-band 10 m raster with a raster attribute table in the NZTM
    projection. To this point the workflow takes under 12 hours of compute time on New Zealand eScience
    Infrastructure.'
  rationale: Wetlands and viticulture were judged too difficult to delineate automatically from spectral
    information with sufficient accuracy, so authoritative existing delineations with a human in the loop
    were retained instead.
- description: 'Sieve filtering. The classified raster was post-processed with an iterative sieve filter
    (gdal_sieve, eight-connectivity) that removes small isolated patches by merging them into their largest
    neighbour, in successive passes with escalating size thresholds of two, three, five and seven pixels.
    Water and no-data areas were masked throughout these passes; a final unmasked five-pixel pass then
    removed the small isolated water patches the mask had protected. The raster attribute table was reattached
    to the filtered raster, which is the published dataset.'
  rationale: The mask prevents land-cover classes from bleeding into water and no-data areas during sieving,
    and the final unmasked pass applies the same cleaning to fragmented water itself. Note that contract
    report LC2526-0006 recommended publishing unfiltered data, with any filtered product alongside; the
    published layer is the filtered product.
# 19139 only: MD_LegalConstraints in ISO 19115:2003 has no `reference` slot for
# the licence citation, so the URL is appended to the statement text instead.
licence_constraint_19139: '{{ scalars.licence_statement }} Licence text: {{ scalars.licence_url }}'
distribution_description: Single-band categorical raster with a raster attribute table, in the NZTM
  projection at {{ scalars.resolution_m }} m resolution.
qml_online_description: The QGIS style file itself (QML), as attached to the layer on the LRIS Portal.
qml_description: Authoritative source of class values, labels and display colours for this dataset. Defines
  a paletted single-band renderer on band 1 at full opacity, with nearest-neighbour resampling and transparent
  no-data. Palette entries are given for values 1 to 16; value 0 (Unclassified) has no entry and renders
  as transparent no-data. Where this style file and other documentation of the dataset disagree on a colour,
  the style file is authoritative.
supplemental_information: 'Commissioning-brief requirements: the brief required all distinct areas of
  land cover of at least 100 m² in area and 20 m in width to be mapped, and specified delivery in NZTM
  at 10 m resolution. Note that the published data are sieve-filtered (see the lineage): isolated patches
  smaller than seven pixels do not survive to publication, so the effective minimum size of an isolated
  feature (700 m²) is larger than the 100 m² the brief specifies. Contract report LC2526-0006 recommended
  that any filtered product be published alongside, rather than instead of, unfiltered data; the published
  layer is the filtered product.


  Class codes: values 0 to 16 are defined. Value 5 (Cloud) is a reserved code that is not used in this
  edition — small areas of residual cloud in the {{ edition }} mosaic were assigned to value 0 (Unclassified)
  instead.


  Class labelling: Table 1 of the source paper labels class 3 "Indigenous Vegetation" while its Tables
  2 and 3, the contract report, and the QGIS style file all use "Indigenous Forest"; the latter is used
  here. Class 13 is "Broadleaved Shrub" (singular) in the style file and contract report, and "Broadleaved
  Shrubs" in the paper.


  Class 12 (Deciduous Hardwoods) derivation: Table 1 of contract report LC2526-0006 records the method
  as spectral rules, but section 4.1.7 of the same report and Figure 2 of the source paper both describe
  it as a deep-learning classification restricted to lowland areas. The production code (binary_split/exotic/exotic.py)
  confirms the deep-learning derivation: the label is applied wherever the model predicts deciduous hardwoods
  and the terrain is lowland. Note that, unlike exotic forest, the label is not additionally confined
  to areas the spectral hierarchy had identified as woody.


  Mapped areas by island are tabulated in Table 2 of the source paper; the validation confusion matrix
  is Table 3 of the paper and Figure 6 of LC2526-0006; the spectral rules and their thresholds are in
  Appendix A of the paper and Table 4 of Dymond and Shepherd (2004). Approximate concordances to LCDB
  v5, ESA WorldCover, Google Dynamic World and GLC_FCS30D are given in Appendix A of contract report 2526-0005.'
