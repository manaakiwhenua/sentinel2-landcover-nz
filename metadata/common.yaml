purpose: To provide timely, low-cost, national-scale land-cover information at finer spatial resolution
  (10 m) and smaller minimum mappable feature size than the New Zealand Land Cover Database (1 ha minimum
  mapping unit, 1:50,000 scale), suitable for annual environmental reporting and monitoring.
credit: Partially funded by the Ministry for the Environment, New Zealand, and by the Ministry of Business,
  Innovation and Employment, New Zealand. Produced using New Zealand eScience Infrastructure (NeSI) high-performance
  computing facilities, consulting support and training services; NeSI is funded jointly by its collaborator
  institutions and through MBIE's Research Infrastructure programme. Contains modified Copernicus Sentinel-2
  data.
extent_description: The full terrestrial extent of mainland New Zealand and its offshore islands, including
  Stewart Island / Rakiura and Manawatāwhi / Three Kings Islands, and a coastal margin. The Chatham Islands
  and other outlying islands are excluded.
