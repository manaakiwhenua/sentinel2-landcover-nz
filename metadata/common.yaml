- title: An automated method for generalised land cover mapping over New Zealand (MWLR Contract Report
    LC2526-0006)
environment_description: Categorical (thematic) raster, 10 m cell size, single band of integer class codes,
  supplied with a raster attribute table.
maintenance_note: The workflow completes in under 12 hours of computing time on NeSI infrastructure and
  can be re-run annually on a new summer mosaic; annual production is a standing recommendation of LC2526-0006.
  Editions are independent snapshots and are not co-registered as a change time series.
metadata_maintenance_note: Metadata drafted from Dymond et al. (2026), MWLR contract reports LC2526-0006
  and 2526-0005, and the QGIS style file celcmqml.qml. Fields marked "CHECK" in the XML comments require
  confirmation against the published LRIS layer or the production code.
abstract: 'A national land-cover classification of New Zealand at 10 m spatial resolution, derived from
  a cloud-free summer mosaic of Sentinel-2 imagery for the {{ edition }} season ({{ scalars.temporal_begin
  | nzdate }} to {{ scalars.temporal_end | nzdate }}, inclusive). Sixteen land-cover classes are mapped (fifteen mapped classes plus an unclassified
  value), spanning fundamental cover types (water, bare ground, snow, herbaceous vegetation) and woody
  and production classes of particular relevance to New Zealand land use (exotic forest, indigenous forest,
  narrow-leaved scrub, broadleaved shrub, deciduous hardwoods, croplands, orchards and vineyards, wetlands).


  The classification is produced by an automated workflow that combines three complementary methods: a
  hierarchy of binary spectral decision rules applied to topographically normalised, standardised surface
  reflectance; a U-Net convolutional neural network for classes where texture and spatial context are
  decisive (exotic forest, deciduous hardwoods); and analysis of a five-year Sentinel-2 NDVI time series
  ({{ scalars.ndvi_years }}) to detect the repeated bare/vegetated cycles characteristic of regular tillage. Two classes
  that are unreliable to delineate from imagery alone — wetlands, and orchards and vineyards — are burned
  in unchanged from the New Zealand Land Cover Database (LCDB) version 5, as is the glacial lakes extent.
  A national digital elevation model (15 m postings, resampled to the 10 m analysis grid) is used both
  for topographic normalisation and as ancillary evidence at particular decision nodes.


  National classification runs in under 12 hours of computing time on New Zealand eScience Infrastructure
  (NeSI), making annual updates feasible at roughly an order of magnitude lower cost than the manually
  interpreted LCDB. Validation of the unfiltered 2023/24 classification against 4,500 points (300 per
  mapped class, stratified by map class, drawn
  from a population of approximately 2.7 billion valid pixels) gave a weighted overall accuracy of {{
  quality_reports[0].quantitative_result_percent }} %.


  Intended applications include protective cover for soil erosion, national and on-farm carbon accounting,
  habitat connectivity modelling for predator control, nutrient budgeting for water quality, monitoring
  of habitat loss in protected wetlands, and fire fuel assessment.


  Important limitations. This dataset is a snapshot, not a change product: simple differencing of successive
  editions will produce spurious change even at high accuracy — of the order of several percent of the
  national land area per year, which exceeds expected real change. Change should be inferred only with
  multi-year persistence checks, checks for similar change in adjacent areas, spatial filtering of small
  clumps, or reference to LCDB, where expert operators check all candidate change. Two classes are markedly
  less accurate than the rest and should be treated with more caution: Broadleaved Shrub and Unspecified
  Woody Vegetation (F1 approximately 82 % and 88 % respectively, with precision near 70–79 %). The published
  dataset has been post-processed with an iterative sieve filter that removes small isolated patches:
  isolated features smaller than seven pixels (700 m²), or five pixels (500 m²) for water, are merged
  into their surroundings and do not appear in the published data, whatever their true cover.'
use_limitations:
- 'Not suitable for direct pixel-by-pixel change detection between editions: simple differencing will
  infer spurious change over a substantial area even when both editions are highly accurate. Refer to
  LCDB for authoritative change information.'
- The Broadleaved Shrub and Unspecified Woody Vegetation classes have materially poorer validation results
  than the rest of the taxonomy and should be treated with more caution.
- Snow reflects conditions at the time of image acquisition within the summer mosaic window, not a long-term
  snow climatology.
- Wetlands, orchards and vineyards, and glacial lakes are inherited from LCDB v5 and therefore carry that
  dataset's nominal date (2018/19) and 1 ha minimum mapping unit rather than those of this dataset.
- The published raster is sieve-filtered. Isolated patches smaller than seven pixels (700 m²), or five
  pixels (500 m²) for water, have been merged into their surroundings, so the effective minimum size
  of an isolated feature is larger than the 100 m² minimum mappable feature of the commissioning brief.
  The validation figures were assessed on the unfiltered 2023/24 classification, before this filtering.
- The accuracy figures derive from a single validation exercise performed on the 2023/24 edition. Subsequent
  editions are produced by the same automated method from more recent imagery and are not individually
  revalidated.
attribute_description: Land-cover class code (8-bit unsigned integer; values 0 to 16, where 5 is reserved
  and unused in this edition)
band_description: Single band of land-cover class codes. Seventeen values are defined (0 to 16), of which
  fifteen are mapped land-cover classes; value 0 is unclassified and value 5 is reserved and unused. Each
  class is listed below with its pixel value, label, definition, derivation method and display colour.
  Colours are 24-bit RGB in HTML hexadecimal notation and are taken from the authoritative QGIS paletted-raster
  style file (celcmqml.qml), which is referenced formally under portrayalCatalogueInfo.
classes:
- value: 0
  label: Unclassified
  colour: '#000000'
  definition: 'Exterior marine, or remnant from cloud masking and mosaicking; small areas of residual
    cloud in the {{ edition }} mosaic are also assigned this value. Derivation: not applicable (no class assigned).
    Colour: #000000. Note that the QGIS style file defines no palette entry for this value and renders
    it as transparent no-data; the colour given here is the one specified in Table 1 of contract report
    LC2526-0006.'
- value: 1
  label: Water
  colour: '#359ec9'
  definition: 'Water bodies, including a coastal margin. Derivation: spectral rules, binary split — identified
    from the near-infrared and shortwave-infrared bands alongside the visible bands, after the snow split.
    Colour: #359ec9.'
- value: 2
  label: Bare Ground
  colour: '#d3d3d3'
  definition: 'Bare ground without vegetation cover. Derivation: spectral rules, binary split. Colour:
    #d3d3d3.'
- value: 3
  label: Indigenous Forest
  colour: '#006400'
  definition: 'Mature forest comprising indigenous tree species. Derivation: spectral rules, binary split
    — the remainder of the forest/trees node after exotic forest has been subtracted by deep learning
    and small clumps have been separated as unspecified woody vegetation. Colour: #006400. Labelled "Indigenous
    Vegetation" in Table 1 of the source paper and in the published map legends.'
- value: 4
  label: Herbaceous Vegetation
  colour: '#f6f99e'
  definition: 'Non-woody vegetation — primarily high-producing (exotic) and low-producing (exotic and
    indigenous) grasslands, and indigenous tussock grasslands. Derivation: spectral rules, binary split
    of vegetation into herbaceous or woody vegetation. Colour: #f6f99e.'
- value: 5
  label: Cloud
  colour: '#ffffff'
  definition: 'Cloud. Reserved code, not used in this edition: residual cloud remaining in the {{ edition }}
    mosaic was assigned to value 0 (Unclassified) instead. Derivation: not applicable. Colour: #ffffff.'
- value: 6
  label: Primarily Bare Ground
  colour: '#d1b28c'
  definition: 'A mix of bare ground (greater than 50 % of the cell) and vegetation cover; includes herb
    fields and rock fields. Derivation: spectral rules, binary split. Colour: #d1b28c.'
- value: 7
  label: Snow
  colour: '#ff00ff'
  definition: 'Snow cover at the time of image acquisition. Derivation: spectral rules, binary split —
    the first split in the hierarchy, constrained by the national digital elevation model to terrain
    above 150 m in order to avoid confusion between snow and bright coastal water such as whitecaps and
    turbid estuary water. Colour: #ff00ff.'
- value: 8
  label: Glacial Lakes, Wet Rock, Water/Sediment
  colour: '#5ab2ff'
  definition: 'Glacial lakes, and rock or sand covered by shallow water. Derivation: spectral rules, binary
    split; the glacial lakes extent is adopted from LCDB version 5. Colour: #5ab2ff.'
- value: 9
  label: Unspecified Woody Vegetation
  colour: '#666666'
  definition: 'Small (less than 0.2 ha) clumps of unspecified trees. Derivation: a centre-to-edge ratio
    computation identifies small clusters of woody vegetation which contain insufficient pixel-level information
    to be classified further at 10 m resolution; attempts to resolve these stands into conifer and non-conifer
    types using a model trained on aerial imagery were unsuccessful, so they remain unspecified. Colour:
    #666666. This class has materially poorer validation results than the rest of the taxonomy.'
- value: 10
  label: Narrow-leaved Scrub
  colour: '#709c63'
  definition: 'Immature shrublands with narrow leaves — primarily mānuka, kānuka, gorse, broom and matagouri.
    Derivation: spectral rules, binary split of woody vegetation into narrow-leaved scrub or other woody
    vegetation, using the index (ρ4 − ρ5)/(ρ4 + ρ5) with a threshold of 0.25, reduced from the 0.33 of
    Dymond and Shepherd (2004) to give an acceptable spatial distribution per expert judgement (ρ4 is
    near-infrared, 0.77–0.90 µm; ρ5 is shortwave infrared, 1.55–1.75 µm). Colour: #709c63.'
- value: 11
  label: Exotic Forest
  colour: '#ab291f'
  definition: 'Planted exotic forest — primarily Pinus radiata; may include wilding pines. Derivation:
    U-Net deep-learning classification of Sentinel-2 imagery trained on LCDB v5, applied conditionally
    within the forest branch of the decision hierarchy so that it disambiguates forest already identified
    by spectral rules rather than over-ruling earlier binary decisions. Colour: #ab291f.'
- value: 12
  label: Deciduous Hardwoods
  colour: '#ffa600'
  definition: 'Mature exotic deciduous trees — primarily poplars and willows. Derivation: U-Net deep-learning
    classification, restricted to lowland terrain; unlike exotic forest, the label is not additionally
    confined to areas the spectral hierarchy had identified as woody. Colour: #ffa600. See supplementalInformation
    for the resolution of a documented inconsistency about this class''s derivation method.'
- value: 13
  label: Broadleaved Shrub
  colour: '#ff80a1'
  definition: 'Immature shrublands with broad leaves — primarily indigenous broadleaved species. Derivation:
    spectral rules, binary split — near-infrared and shortwave-infrared threshold rules distinguishing
    narrow-leaf from broad-leaf vegetation within the woody layer; the split from forest/trees is on green
    reflectance (ρ2 greater than 0.0403). Colour: #ff80a1. This class has the poorest validation results
    in the taxonomy (precision approximately 70 %).'
- value: 14
  label: Croplands
  colour: '#824ab3'
  definition: 'Cropping land with evidence of regular tillage. Derivation: temporal sequence of NDVI from
    Sentinel-2 ({{ scalars.ndvi_period }}), using the median NDVI of vegetated pixels, the median
    NDVI of all observations, and the ratio of time in vegetation to time not in vegetation; conditional
    on the terrain being sufficiently flat to be plausible cropland, per the digital elevation model.
    This is the final binary split. Colour: #824ab3. The method detects a repeating bare/vegetated pattern
    without regard to the time of year at which it occurs, so cropping is the probable but not the only
    possible explanation of the signal.'
- value: 15
  label: Wetlands
  colour: '#91d491'
  definition: 'Wetland ecosystems. Derivation: burned in from LCDB version 5 (LCDB class 15), taken as
    given because the class was judged too difficult to delineate automatically with sufficient accuracy
    from spectral information. Colour: #91d491. This class carries the nominal date and minimum mapping
    unit of LCDB v5 rather than of the {{ edition }} mosaic.'
- value: 16
  label: Orchards and Vineyards
  colour: '#f6c2cf'
  definition: 'Land managed to produce grapes and other perennial crops. Derivation: burned in from LCDB
    version 5 (LCDB class 16), taken as given for the same reason as wetlands. Colour: #f6c2cf. This class
    carries the nominal date and minimum mapping unit of LCDB v5.'
quality_reports:
- name: Weighted overall classification accuracy
  description: 'For each mapped class, precision is the percentage of mapped pixels found to be correct
    and recall is the percentage of the true class correctly mapped; the F1-score is the harmonic mean
    of the two, giving them equal weight. The overall accuracy is the class F1-score averaged and weighted
    by mapped area. The source paper rounds this figure to 96 %. The validation was performed on the
    unfiltered 2023/24 classification, before the sieve filtering described in the lineage: the figures
    describe the pre-filter map of that edition. The series is validated once — subsequent editions apply
    the same automated method to more recent imagery and are not individually revalidated.'
  evaluation:
    description: 'Stratified random sampling by map class. Pixels were selected at random and iteratively,
      and were included in the sample if the class had fewer than 300 samples so far and the pixel had
      not already been sampled, continuing until every mapped class held 300 pixels. The random seed was
      the sample date, so the sample is reproducible. The total sample was 4,500 pixels (15 classes ×
      300) drawn from a population of approximately 2.7 billion valid pixels.


      Every point was assessed by a single expert validator with experience in remote sensing and the
      New Zealand environmental context, using MapAccuracy software, which presents sample points individually
      over the classified map alongside contextual windows displaying Sentinel-2 imagery (including the
      temporal sequence) and recent aerial photography. The validator could label each point determinately
      as valid or invalid, or indeterminately as likely or unlikely. In the reported accuracy figures,
      ''likely'' is counted as valid and ''unlikely'' as invalid, rather than excluding indeterminate
      results.


      Resourcing did not permit redundant expert validators or additional non-expert validators, so some
      inter-validator disagreement should be expected. For context, Brown et al. (2022) reported 77.8
      % overall agreement between consensus non-expert and consensus expert land-cover validation for
      Google Dynamic World, a product also derived from Sentinel-2 but with fewer classes.'
    sampling_scheme: Stratified random sampling, stratified by map class, with a constant random seed
    lot_description: 4,500 sample pixels (300 per mapped class, 15 classes) from approximately 2.7 billion
      valid pixels across the national extent
    procedure_title: MapAccuracy
    procedure_url: https://anaconda.org/gillins/mapaccuracy
  quantitative_result_percent: 96.45
- name: Per-class F1-score
  description: 'F1-scores by class from the same 4,500-point stratified sample, as percentages: Bare Ground
    98.0; Broadleaved Shrub 82.2; Cropland 94.9; Deciduous Hardwoods 96.2; Exotic Forest 96.9; Glacial
    Lakes, Wet Rock, Water/Sediment 98.0; Herbaceous Vegetation 84.8; Indigenous Forest 90.4; Narrow-leaved
    Scrub 93.1; Orchards and Vineyards 98.8; Primarily Bare Ground 94.9; Snow 97.9; Unspecified Woody
    Vegetation 88.2; Water 94.1; Wetlands 99.2. All classes except Broadleaved Shrub and Unspecified Woody
    Vegetation exceed 90 %. The full contingency table with precision and recall is Table 3 of the source
    paper and Figure 6 of contract report LC2526-0006.'
  descriptive_result: 'Per-class F1-scores range from 82.2 % (Broadleaved Shrub) to 99.2 % (Wetlands).
    The two weakest classes are weak in precision rather than recall: Broadleaved Shrub has 70.0 % precision
    against 99.5 % recall, and Unspecified Woody Vegetation 79.3 % precision against 99.2 % recall — both
    are over-mapped, drawing most of their false positives from herbaceous vegetation and indigenous forest.
    Herbaceous Vegetation shows the converse pattern (98.3 % precision, 74.5 % recall), being under-mapped
    where it is confused with shrubland and small woody clumps.'
- name: Deep-learning model accuracy for the exotic forest class (development assessment)
  description: Assessment of the U-Net models against LCDB v5 during development, reported separately
    for the two island models and distinct from the validation of the final published map. On the 2018/19
    mosaic the exotic forest class accuracy was 90.3 % for the North Island model and 83.5 % for the South
    Island model. Both models separated exotic from indigenous forest with better than 97 % precision
    and recall, conditional on a pixel containing forest — better than 99 % for the North Island. The
    main class confusion for both exotic and indigenous forest was with grass, with further significant
    confusion against scrub, bare ground and indigenous hardwoods.
  descriptive_result: Overall model accuracies across all modelled classes were 87.0 % (North Island,
    13 classes) and 86.1 % (South Island, 12 classes). These figures assess the models, not the published
    dataset, and are recorded here for provenance only.
lineage_statement: 'This dataset was produced by an automated workflow that classifies a cloud-free national
  summer mosaic of Sentinel-2 imagery ({{ scalars.temporal_begin | nzdate }} to {{ scalars.temporal_end
  | nzdate }}) into fifteen land-cover classes
  at 10 m resolution. Sentinel-2 scenes were standardised to surface reflectance — atmospherically corrected
  and normalised to a standard sun position and flat topography — so that reflectance is a property of
  the vegetation alone, independent of sun position, slope and view direction. Cloud and cloud shadow
  were masked using an improved multi-temporal (Tmask) algorithm with an object-based approach to remove
  false cloud detections, and the scenes composited into a national mosaic drawing on approximately 100
  satellite overpasses, with residual cloud typically below 0.1 %. Small areas of residual cloud in the
  mosaic were assigned to the unclassified value in the output.


  Classification proceeds down a hierarchy of binary splits, with the method for each split chosen to
  maximise accuracy at that node. The hierarchy is used because land covers are naturally organised hierarchically,
  a different discrimination function can be applied at each node, binary discriminant functions are simple
  to express and repeat, and covers identified by other methods can be injected at a suitable point in
  the tree. Most splits are made by expert-defined spectral decision rules applied to the standardised
  reflectance, with thresholds taken from Dymond and Shepherd (2004) and selected interactively to achieve
  optimum spatial distribution according to expert judgement. Two classes are not spectrally separable
  and are handled otherwise: exotic forest (and, in lowland terrain, deciduous hardwoods)
  is classified by a U-Net convolutional neural network and applied conditionally within the forest branch
  so that it disambiguates rather than over-rules the earlier splits; and cropland is identified from
  the temporal dynamics of NDVI over a five-year Sentinel-2 archive ({{ scalars.ndvi_period }}), conditional
  on the terrain being sufficiently flat. Ancillary data enter the workflow at specific nodes: a national
  digital elevation model (15 m postings, resampled to the 10 m analysis grid) constrains the snow and
  cropland decisions, and LCDB is used to relax
  the near-infrared, shortwave-infrared and red thresholds wherever it has pre-identified forest, mangrove
  or scrub. Wetlands and orchards and vineyards are then accepted (burned in) unchanged from LCDB version
  5.


  The classification workflow executes in under 12 hours of computing time on New Zealand eScience Infrastructure.
  The classified raster is then post-processed with an iterative sieve filter that removes small isolated
  patches, at escalating size thresholds up to seven pixels, with water protected until a final five-pixel
  pass. The method is described in Dymond
  et al. (2026) and, in greater operational detail, in contract report LC2526-0006; the production code
  and trained models are at https://github.com/manaakiwhenua/sentinel2-landcover-nz.'
